name: CI

# Documentation-only pushes don't need a macOS build. Pull requests always run:
# these jobs are required checks on main and dev, and a check that never runs
# would block a documentation-only pull request forever.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        # Unit tests are mock-based by design — CI VMs have no AppleSMC service,
        # so anything touching real hardware must stay out of the test target.
        run: swift test

      - name: Release build
        run: swift build -c release

  app:
    name: App Build & Test (macOS 26)
    # The menu bar app targets macOS 26 and needs Xcode 26 (SwiftUI macros);
    # the macos-26 image has both.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            App/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-app-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-

      - name: Build
        run: swift build --package-path App

      - name: Test
        # Tests run on SampleService fakes: no SMC, no daemon, no privileges.
        run: swift test --package-path App
